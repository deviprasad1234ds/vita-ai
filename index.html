<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>VITA AI — Food Safety Scanner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Helvetica, sans-serif;
            background: #f8f9fc;
            color: #1a2c3e;
            min-height: 100vh;
        }

        .app-container {
            max-width: 500px;
            margin: 0 auto;
            background: #ffffff;
            min-height: 100vh;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }

        .header {
            padding: 20px 20px 12px;
            background: white;
            border-bottom: 1px solid #eef2f5;
        }
        .header h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .header p {
            font-size: 13px;
            color: #7f8c8d;
            margin-top: 4px;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: #f8f9fc;
            border-bottom: 1px solid #eef2f5;
        }
        .streak {
            background: #e8f5e9;
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 600;
            color: #2e7d32;
        }
        .badge {
            background: #fff3e0;
            padding: 6px 12px;
            border-radius: 40px;
            font-size: 12px;
        }

        .scan-button {
            margin: 24px 20px;
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            border-radius: 60px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
            box-shadow: 0 4px 15px rgba(46,204,113,0.3);
        }
        .scan-button:active { transform: scale(0.97); }
        .scan-button span:first-child { font-size: 32px; display: block; }
        .scan-button span:last-child { font-size: 18px; font-weight: 700; color: white; margin-top: 8px; display: block; }

        .profile-banner {
            background: #f8f9fc;
            margin: 0 20px 20px;
            padding: 14px 16px;
            border-radius: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #eef2f5;
        }
        .profile-tags { display: flex; gap: 8px; flex-wrap: wrap; }
        .tag { background: #e8f0fe; padding: 4px 12px; border-radius: 40px; font-size: 12px; color: #2ecc71; }

        .section-title {
            padding: 20px 20px 12px;
            font-size: 16px;
            font-weight: 600;
            color: #2c3e50;
        }
        .scans-list {
            margin: 0 20px;
            background: white;
            border-radius: 20px;
            border: 1px solid #eef2f5;
            overflow: hidden;
        }
        .scan-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            border-bottom: 1px solid #eef2f5;
        }
        .scan-item:last-child { border-bottom: none; }
        .scan-name { font-weight: 500; }
        .scan-score {
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 40px;
            font-size: 13px;
        }
        .score-red { background: #fee2e2; color: #e74c3c; }
        .score-yellow { background: #fef9e3; color: #f39c12; }
        .score-green { background: #e8f5e9; color: #2ecc71; }

        .paywall-card {
            margin: 20px;
            background: linear-gradient(135deg, #1a2c3e, #0f1a24);
            border-radius: 28px;
            padding: 24px;
            color: white;
            text-align: center;
        }
        .paywall-card h3 { font-size: 20px; margin-bottom: 8px; }
        .paywall-card p { opacity: 0.8; margin-bottom: 20px; font-size: 13px; }
        .paywall-button {
            background: #f39c12;
            color: #1a2c3e;
            border: none;
            padding: 14px 24px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
        }
        .result-card {
            margin: 20px;
            background: white;
            border-radius: 28px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .result-emoji { font-size: 72px; text-align: center; }
        .result-score { font-size: 48px; font-weight: 800; text-align: center; margin: 8px 0; }
        .result-tier { font-size: 20px; font-weight: 600; text-align: center; margin: 8px 0; }
        .harmful-list {
            background: #f8f9fc;
            border-radius: 20px;
            padding: 16px;
            margin: 16px 0;
            max-height: 400px;
            overflow-y: auto;
        }
        .harmful-item {
            padding: 12px 0;
            border-bottom: 1px solid #eef2f5;
        }
        .harmful-item:last-child { border-bottom: none; }
        .harmful-name {
            font-weight: 700;
            color: #e74c3c;
            font-size: 15px;
        }
        .harmful-reason {
            font-size: 12px;
            color: #7f8c8d;
            margin-top: 4px;
            line-height: 1.4;
        }
        .harmful-source {
            font-size: 10px;
            font-family: monospace;
            color: #2ecc71;
            margin-top: 4px;
        }
        .country-status {
            display: flex;
            gap: 12px;
            margin-top: 6px;
            font-size: 11px;
        }
        .country-status span { padding: 2px 6px; border-radius: 20px; background: #eef2f5; }
        .eu-banned { background: #fee2e2; color: #e74c3c; }
        .us-permitted { background: #e8f5e9; color: #2ecc71; }
        .loading {
            text-align: center;
            padding: 40px;
            color: #2ecc71;
            font-size: 14px;
        }
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            border-radius: 48px;
            padding: 32px;
            text-align: center;
            max-width: 300px;
            width: 80%;
        }
        .wheel { font-size: 64px; margin: 20px 0; animation: spin 0.5s ease-out; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .hidden { display: none; }
        .footer { padding: 20px; text-align: center; font-size: 11px; color: #95a5a6; }
        textarea {
            width: 100%;
            padding: 16px;
            border: 1px solid #eef2f5;
            border-radius: 20px;
            margin: 16px 20px 0;
            width: calc(100% - 40px);
            font-family: monospace;
            font-size: 13px;
            resize: vertical;
        }
        button { cursor: pointer; }
    </style>
</head>
<body>
<div class="app-container">
    <div class="header">
        <h1>🔬 VITA AI</h1>
        <p>AI-powered food safety · Know what's inside</p>
    </div>

    <div class="stats-bar">
        <div class="streak"><span>🔥</span> <span id="streakCount">0</span> day streak</div>
        <div class="badge" id="badgeText">🕵️ Detective</div>
    </div>

    <div id="profileBanner" class="profile-banner">
        <div class="profile-tags" id="profileTags"></div>
        <button id="editProfileBtn" style="background:none; border:none; color:#2ecc71;">✏️</button>
    </div>

    <div class="scan-button" id="scanBtn">
        <span>📸</span>
        <span>SCAN LABEL</span>
    </div>

    <textarea id="ingredientsInput" rows="3" placeholder="Or paste ingredient list here...&#10;Example: titanium dioxide, red 40, sugar, BPA lining, potassium bromate, high fructose corn syrup"></textarea>
    <button id="analyzeBtn" style="margin: 16px 20px 0; background: #2ecc71; border: none; padding: 14px; border-radius: 40px; font-weight: 700; width: calc(100% - 40px);">🔍 ANALYZE WITH AI</button>

    <div class="section-title">📋 RECENT SCANS</div>
    <div id="scansList" class="scans-list">
        <div class="scan-item" style="justify-content:center; color:#95a5a6;">No scans yet. Scan your first food!</div>
    </div>

    <div id="paywallContainer" class="hidden"></div>
    <div id="resultContainer" class="hidden"></div>

    <div class="footer">
        ⚖️ AI analysis based on EFSA, FDA, WHO, and peer-reviewed research. Not medical advice.<br>
        🇪🇺 🇺🇸 🇮🇳 — Regulatory status varies by country.
    </div>
</div>

<script>
    // =============================================
    // APP STATE (LocalStorage)
    // =============================================
    let freeScansLeft = parseInt(localStorage.getItem('vita_free_scans') || '5');
    let scansTotal = parseInt(localStorage.getItem('vita_scans_total') || '0');
    let streak = parseInt(localStorage.getItem('vita_streak') || '0');
    let lastScanDate = localStorage.getItem('vita_last_scan') || null;
    let userProfile = JSON.parse(localStorage.getItem('vita_profile') || '{"pregnant":false,"infant":false,"senior":false,"pet":false}');
    let userCountry = localStorage.getItem('vita_country') || 'US';
    let isPremium = localStorage.getItem('vita_premium') === 'true';
    let recentScans = JSON.parse(localStorage.getItem('vita_recent_scans') || '[]');

    function updateStreak() {
        const today = new Date().toDateString();
        if (lastScanDate !== today) {
            if (lastScanDate) {
                const yesterday = new Date();
                yesterday.setDate(yesterday.getDate() - 1);
                if (lastScanDate === yesterday.toDateString()) streak++;
                else streak = 1;
            } else streak = 1;
            lastScanDate = today;
            localStorage.setItem('vita_streak', streak);
            localStorage.setItem('vita_last_scan', lastScanDate);
        }
        document.getElementById('streakCount').innerText = streak;
    }

    function updateUI() {
        const tags = [];
        if (userProfile.pregnant) tags.push('🤰 Pregnant');
        if (userProfile.infant) tags.push('🍼 Infant');
        if (userProfile.senior) tags.push('👴 Senior');
        if (userProfile.pet) tags.push('🐾 Pet');
        if (tags.length === 0) tags.push('👤 Adult');
        document.getElementById('profileTags').innerHTML = tags.map(t => `<span class="tag">${t}</span>`).join('');
        document.getElementById('badgeText').innerText = isPremium ? '✨ Premium' : (scansTotal > 10 ? '🕵️ Truth Seeker' : '🔍 Detective');

        const scansContainer = document.getElementById('scansList');
        if (recentScans.length === 0) {
            scansContainer.innerHTML = '<div class="scan-item" style="justify-content:center; color:#95a5a6;">No scans yet. Scan your first food!</div>';
        } else {
            scansContainer.innerHTML = recentScans.slice(0,5).map(s => `
                <div class="scan-item">
                    <span class="scan-name">${s.name || 'Product'}</span>
                    <span class="scan-score score-${s.score < 5 ? 'red' : (s.score < 8 ? 'yellow' : 'green')}">${s.score}/10</span>
                </div>
            `).join('');
        }

        const paywallDiv = document.getElementById('paywallContainer');
        if (!isPremium && freeScansLeft <= 0) {
            paywallDiv.classList.remove('hidden');
            paywallDiv.innerHTML = `
                <div class="paywall-card">
                    <h3>🔒 Want to see the truth?</h3>
                    <p>You've used your free scans. Subscribe to unlock:<br>
                    ❌ Full list of harmful ingredients<br>
                    📜 Scientific reasons with citations<br>
                    🌍 Country-specific bans (EU vs US)<br>
                    ♾️ Unlimited scans</p>
                    <button class="paywall-button" id="subscribeBtn">Subscribe $4.99/month</button>
                </div>
            `;
            document.getElementById('subscribeBtn')?.addEventListener('click', () => {
                alert("🔓 Premium activated! (Demo)\nIn production, Stripe would open.");
                isPremium = true;
                freeScansLeft = 999;
                localStorage.setItem('vita_premium', 'true');
                localStorage.setItem('vita_free_scans', freeScansLeft);
                updateUI();
            });
        } else {
            paywallDiv.classList.add('hidden');
        }
        updateStreak();
    }

    function saveScan(productName, score) {
        recentScans.unshift({ name: productName.substring(0, 30), score: score, date: new Date().toISOString() });
        recentScans = recentScans.slice(0, 10);
        localStorage.setItem('vita_recent_scans', JSON.stringify(recentScans));
        scansTotal++;
        localStorage.setItem('vita_scans_total', scansTotal);
        updateUI();
    }

    // =============================================
    // GROQ AI ANALYSIS via Netlify Function (Secure)
    // =============================================
    async function analyzeWithGroq(ingredients) {
        const response = await fetch('/.netlify/functions/groq', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ingredients })
        });
        
        if (!response.ok) {
            const error = await response.json();
            throw new Error(error.error || `API error: ${response.status}`);
        }
        
        return await response.json();
    }

    async function performAnalysis() {
        const ingredients = document.getElementById('ingredientsInput').value.trim();
        if (!ingredients) {
            alert("Please paste ingredients or use camera to scan label");
            return;
        }

        if (!isPremium && freeScansLeft <= 0) {
            alert("You've used all free scans. Subscribe to continue!");
            updateUI();
            return;
        }

        const resultDiv = document.getElementById('resultContainer');
        resultDiv.classList.remove('hidden');
        resultDiv.innerHTML = `<div class="loading">🔬 VITA AI analyzing ingredients...<br>Using Groq's food safety knowledge (EFSA, FDA, WHO)</div>`;
        document.getElementById('paywallContainer').classList.add('hidden');

        try {
            const analysis = await analyzeWithGroq(ingredients);

            if (!isPremium) {
                freeScansLeft--;
                localStorage.setItem('vita_free_scans', freeScansLeft);
            }

            saveScan(ingredients.substring(0, 30), analysis.score);

            const emoji = analysis.score <= 3 ? '🤮' : (analysis.score <= 6 ? '⚠️' : '😍');
            const tierColor = analysis.tier === 'RED' ? '#e74c3c' : (analysis.tier === 'YELLOW' ? '#f39c12' : '#2ecc71');

            let harmfulHtml = '';
            if (analysis.harmful_ingredients && analysis.harmful_ingredients.length > 0) {
                harmfulHtml = `<div class="harmful-list"><strong>⚠️ HARMFUL INGREDIENTS DETECTED:</strong><br><br>`;
                for (const h of analysis.harmful_ingredients) {
                    harmfulHtml += `
                        <div class="harmful-item">
                            <div class="harmful-name">❌ ${h.name}</div>
                            <div class="harmful-reason">📜 ${h.reason}</div>
                            <div class="country-status">
                                <span class="${h.eu_status?.includes('BANNED') ? 'eu-banned' : ''}">🇪🇺 EU: ${h.eu_status || 'Check'}</span>
                                <span>🇺🇸 US: ${h.us_status || 'Permitted'}</span>
                                <span>🇮🇳 India: ${h.india_status || 'Permitted'}</span>
                            </div>
                            <div class="harmful-source">📄 Source: ${h.source || 'EFSA/FDA'}</div>
                        </div>
                    `;
                }
                harmfulHtml += `</div>`;
            } else {
                harmfulHtml = `<div class="harmful-list"><strong>✅ NO HARMFUL INGREDIENTS DETECTED</strong><br><br>This product appears to contain only ingredients with no known safety concerns.</div>`;
            }

            resultDiv.innerHTML = `
                <div class="result-card">
                    <div class="result-emoji">${emoji}</div>
                    <div class="result-score">${analysis.score} / 10</div>
                    <div class="result-tier" style="color: ${tierColor}">${analysis.tier} TIER</div>
                    ${harmfulHtml}
                    <div style="margin-top: 16px; padding: 12px; background: #f8f9fc; border-radius: 16px;">
                        <strong>🔬 VITA SUMMARY</strong><br>
                        ${analysis.summary}
                    </div>
                    <button id="shareResultBtn" style="margin-top: 20px; width: 100%; background: #2ecc71; border: none; padding: 14px; border-radius: 40px; font-weight: 700;">📢 SHARE THE TRUTH</button>
                </div>
            `;

            document.getElementById('shareResultBtn')?.addEventListener('click', () => {
                const shareText = `VITA AI: ${analysis.tier} tier (${analysis.score}/10). ${analysis.summary}`;
                if (navigator.share) navigator.share({ title: 'VITA AI Safety', text: shareText });
                else navigator.clipboard.writeText(shareText);
                if (!isPremium) {
                    freeScansLeft = Math.min(freeScansLeft + 2, 15);
                    localStorage.setItem('vita_free_scans', freeScansLeft);
                    updateUI();
                    alert("+2 free scans for sharing!");
                }
            });

            setTimeout(() => showSpinWheel(), 500);

        } catch (error) {
            console.error(error);
            resultDiv.innerHTML = `<div class="result-card"><div class="loading">❌ Error: ${error.message}<br>Check API key and try again.</div></div>`;
        }
    }

    function showSpinWheel() {
        const prizes = ['+1 free scan', '+2 free scans', '10% off premium', 'Share for 5 scans', 'Try again', '🎉 +1 month free!'];
        const prize = prizes[Math.floor(Math.random() * prizes.length)];
        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `
            <div class="modal-content">
                <h3>🎡 SPIN THE WHEEL</h3>
                <div class="wheel">🎡</div>
                <p>You won:<br><strong>${prize}</strong></p>
                <button id="closeSpinBtn" style="margin-top:16px; padding:8px 24px; border-radius:40px; background:#2ecc71; border:none;">OK</button>
            </div>
        `;
        document.body.appendChild(modal);

        if (prize.includes('free scan')) {
            const bonus = parseInt(prize.match(/\d+/)?.[0] || 1);
            freeScansLeft += bonus;
            localStorage.setItem('vita_free_scans', freeScansLeft);
            updateUI();
        } else if (prize.includes('month free') && !isPremium) {
            isPremium = true;
            freeScansLeft = 999;
            localStorage.setItem('vita_premium', 'true');
            localStorage.setItem('vita_free_scans', freeScansLeft);
            updateUI();
            alert("🎉 You won 1 month free premium!");
        }
        document.getElementById('closeSpinBtn')?.addEventListener('click', () => modal.remove());
    }

    // Event Listeners
    document.getElementById('analyzeBtn').addEventListener('click', performAnalysis);
    document.getElementById('scanBtn').addEventListener('click', () => {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.capture = 'environment';
        input.onchange = async (e) => {
            if (!e.target.files[0]) return;
            alert("📸 For now, please paste the ingredients you see on the label.\nCamera + OCR coming soon!");
        };
        input.click();
    });
    document.getElementById('editProfileBtn').addEventListener('click', () => {
        userProfile = {
            pregnant: confirm("Are you pregnant or trying to conceive?"),
            infant: confirm("Do you have an infant/toddler under 3 in your home?"),
            senior: confirm("Are you 65 years or older?"),
            pet: confirm("Do you have a dog or cat?")
        };
        userCountry = prompt("Select your country (USA, EU, India, UK, Canada):", userCountry);
        localStorage.setItem('vita_profile', JSON.stringify(userProfile));
        localStorage.setItem('vita_country', userCountry);
        updateUI();
    });

    updateUI();
</script>
</body>
</html>
